- round: 3
  kind: revision
  entries:
  - role: perancang
    text: 'Keberatan saya sudah terpenuhi. Palet kunyit di soft-organic.yaml sekarang punya tint #F4DCA6,
      yaitu kuning kunyit pucat, dan tokens.css proyek sudah berisi --pd-color-tint: #F4DCA6. compile_tokens
      menolak palet bila teks di atas tint kurang dari 4,5:1. Hasil ukurnya: teks utama 12,05, teks sekunder
      5,04, tautan 5,21, jadi semuanya aman dibaca. Kuning kunyit sekarang tampil lewat token, bukan warna
      mentah, sehingga palet, nama, dan suasana dapur rumahan jadi selaras. Stabilo di bawah kata "pedas"
      bisa menjadi ciri khas situs ini. Syaratnya, stabilo itu hanya dipakai sekali di h1 beranda dan
      tidak diulang di tempat lain, supaya tetap hemat.'
    objection: 'Bukan pemblokir: stabilo pada span biasa tidak boleh memakai hex mentah. Gradien harus
      memakai var(--pd-color-tint), dan seksi selang-seling cukup memakai tint sebagai latar, bukan sebagai
      warna teks.'
    blocking: false
    resolved: true
    evidence:
    - d-palette-1
    - token:color.tint
resolution:
  method: mufakat
  outcome: tujuh perbaikan beranda
  summary: 'Disepakati: eyebrow ''Kirim ke seluruh Karesidenan Kediri'' (usul ''Dari dapur Bu Sari'' ditolak
    karena menghidupkan veto sidang naskah); hero hanya satu ajakan; judul daftar ''Camilan kami dan harganya''
    tanpa catatan yang mengulang nama; di bawah daftar tombol ''Pesan lewat WhatsApp'' dan tautan ''Lihat
    daftar harga''; daftar harga satu kolom di HP; area sentuh 44px; palet kunyit mendapat token tint
    #F4DCA6 untuk seksi selang-seling dan satu stabilo pada kata ''pedas''. Usul Arsitek menyimpan font
    sendiri ditarik.'
  votes: []
  dissent: []
  vetoes: []
