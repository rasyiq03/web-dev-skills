      QRIS, halal, P-IRT, testimoni, maupun kata goreng atau andalan. Ada tiga perbaikan. (1) Placeholder
      [[ISI: cara pembayaran]] ada di cara-pesan.html (langkah 4 dan baris Cara bayar), tetapi belum terdaftar
      di graf sebagai ph:payment. Graf baru memuat 4 placeholder, jadi check yang hasilnya 0 error tidak
      memeriksanya. Placeholder ini harus didaftarkan sebelum serah terima, sesuai veto di copy.yaml.
      (2) Brief tidak menyebut apakah Bu Sari punya toko di marketplace, tetapi tautan ''Belanja di marketplace''
      di produk.html dan cara-pesan.html tampil sebagai fakta pasti. Placeholdernya hanya ada di href,
      jadi pembeli tidak melihatnya. Tulis teksnya ''Belanja di [[ISI: nama marketplace]]'' supaya pemilik
      melihat bahwa bagian ini perlu diisi, atau dihapus bila tidak punya toko. (3) Di cara-pesan.html,
      ''Chat kami di WhatsApp pada jam buka.'' menyiratkan chat hanya dibalas pada jam tertentu, padahal
      jam buka belum diketahui. Ubah menjadi ''Chat kami di WhatsApp.'' karena jam buka sudah ada di baris
      Jam buka.'
