  - role: wakil-klien
    text: 'Saya sudah memeriksa ketiga halaman kata demi kata. Tidak ada fakta karangan. Nama usaha, Kediri,
      buatan rumah, tiga produk, area kirim seluruh Karesidenan Kediri, dan pesan lewat WhatsApp semuanya
