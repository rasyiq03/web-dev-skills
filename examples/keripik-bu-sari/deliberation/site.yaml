  - role: penulis
    text: '1) Di halaman Produk, tombol "Pesan keripik singkong balado lewat WhatsApp" dan dua tombol
      lainnya terpecah jadi dua baris di HP 360px. Samakan teks yang terlihat dengan halaman lain jadi
      "Pesan lewat WhatsApp", lalu taruh nama produk di aria-label. Pesan WhatsApp-nya tetap menyebut
      produknya. 2) Di halaman Cara pesan, [[ISI: cara pembayaran]] muncul dua kali, di langkah 4 dan
      di baris Cara bayar. Ubah langkah 4 jadi "Bayar pesananmu. Cara bayarnya ada di bawah." supaya placeholder
      cukup diisi sekali dan kalimatnya tidak berakhir dengan titik dua. 3) Naskah dan halaman tidak sama.
      id.yaml punya catatan per produk ("Keripik tempe buatan rumah." dan lainnya) yang tidak tampil di
      produk.html. Catatan itu hanya mengulang nama produk, jadi hapus dari id.yaml. Di Beranda, ganti
      "Lihat daftar harga" jadi "Lihat semua produk", karena harga sudah tampil tepat di atasnya dan teks
      ini cocok dengan menu Produk. Selain itu nada sudah sesuai d-tone-1 (kamu, hangat, kalimat pendek)
      dan tidak ada fakta karangan.'
    evidence:
    - d-tone-1
    - req-goal
    - req-facts.products
    - ph:whatsapp
    - ph:prices
    - check:c-register-id
  - role: arsitek
    text: '1) Font lebih ringan untuk kuota mahasiswa. Di ketiga halaman (index.html, pages/produk.html,
      pages/cara-pesan.html), ubah URL Google Fonts dari DM+Mono:wght@400;700 menjadi DM+Mono:wght@400
      saja. Harga hanya memakai DM Mono 400, dan di CSS tidak ada aturan yang memakai DM Mono 700. 2)
      Jarak tepi ganda di HP. Di layar 360px, .pd-main (padding md) ditambah .pd-section (padding md)
      membuat isi menjorok 32px, sedangkan kepala dan kaki hanya 16px (lihat k2-_index_html-360.png).
      Di layout.css, ubah .pd-main menjadi padding-inline: 0 di bawah 48em, dan pindahkan padding-inline
      var(--pd-space-lg) ke dalam @media (min-width: 48em) yang sudah ada. Dengan begitu teks sejajar
      dengan kepala dan kotak tint featured penuh selebar layar. 3) Pakai token, bukan angka mentah. Di
      components.css, ganti .pd-button:hover transform: translateY(-2px) dengan translateY(calc(-1 * var(--pd-space-xs))).
      Placeholder [[ISI: cara pembayaran]] di cara-pesan.html (langkah 4 dan ledger) belum ada di daftar
      ph: paket, jadi perlu didaftarkan sebagai placeholder resmi supaya ikut diserahkan ke klien. Tetap
      biarkan sebagai placeholder, jangan diisi karangan.'
