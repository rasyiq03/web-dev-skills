- round: 3
  kind: revision
  entries:
  - role: penguji
    text: Keberatan saya sudah terpenuhi. Tiga tombol pesan di halaman produk sekarang memakai aria-labelledby
      yang menunjuk ke tombol itu sendiri lalu ke judul produknya. Jadi pembaca layar menyebut "Pesan
      lewat WhatsApp Keripik singkong balado", "... Keripik tempe", dan "... Makaroni pedas". Namanya
      diawali teks yang terlihat dan berbeda di tiap tombol. Tidak ada lagi aria-label yang menyimpang.
      Hanya nav "Menu utama" yang masih memakai aria-label, dan itu wajar. Laporan check ronde 6 berisi
      0 error, 0 peringatan, dan 23 info. Semua info itu placeholder [[ISI]] yang memang harus diisi klien.
      Saya mencocokkan ke-23 nomor baris di laporan dengan berkasnya, dan semuanya tepat menunjuk baris
      placeholder. Contohnya produk.html baris 70, 74, 85 dan cara-pesan.html baris 78, 85. Laporan ditulis
      pukul 09:42:44, sesudah perubahan terakhir pada HTML dan CSS. Snapshot di rounds/6 juga sama persis
      dengan berkas sekarang. Tangkapan layar k4 di lebar 360 dan 1280 menunjukkan tombol cukup besar
      dan tidak terpotong. Susunan nama, harga, lalu tombol juga rapi.
    blocking: false
    resolved: true
    evidence:
    - req-goal
    - check:c-layout-catalog
    - ph:whatsapp
resolution:
  method: mufakat
  outcome: sembilan perbaikan seluruh situs
  summary: 'Disepakati: tombol pesan per produk menjadi tombol bergaris tepi ''Pesan lewat WhatsApp''
    dengan aria-labelledby ke nama produk (WCAG 2.5.3); placeholder di cara-pesan dibungkus lencana pd-label;
    cara bayar cukup tampil sekali; langkah 1 ''Chat kami di WhatsApp.''; tautan marketplace diberi lencana
    [[ISI: tautan marketplace]] dan dihapus bila tidak ada toko; tepi isi di HP sejajar kepala situs;
    tautan nama usaha dan nomor WhatsApp 44px; panel tint di halaman produk dan cara-pesan; gerak hover
    memakai token. Check diulang: 0 error, 0 peringatan, nomor baris laporan cocok (check.py diperbaiki
    agar snapshot diambil sesudah format). Usul font Arsitek ditarik. Id bukti karangan di jawaban Penguji
    putaran 3 dipangkas ke id graf yang ada.'
  votes: []
  dissent: []
  vetoes: []
