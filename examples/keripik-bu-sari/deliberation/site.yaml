      Keripik tempe": diawali teks yang terlihat dan tetap jelas di luar konteks, karena di daftar tautan
      pembaca layar ada tiga tombol yang tujuannya berbeda. Untuk usulan Perancang (tautan teks "Pesan"
      atau tombol bergaris tepi), pola aria-labelledby yang sama tetap berlaku, dan area ketuknya wajib
      tetap min-height 2.75rem (inline-flex). Jangan kembali ke tautan teks biasa yang tingginya kurang
      dari 44px, karena tombol ini adalah jalur pesan utama.'
