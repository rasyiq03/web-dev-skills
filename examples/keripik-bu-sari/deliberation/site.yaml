    text: '1) pages/produk.html, a.pd-price-list__order: tombol pesan per produk saat ini berupa pil cokelat
      penuh yang di layar 360 px pecah jadi dua baris, sehingga daftar harga tenggelam. Ubah menjadi tautan
      teks pendek "Pesan" (pd-text-link) atau tombol kecil bergaris tepi, lalu letakkan harga sebaris
      dengan nama, supaya bentuknya sama dengan daftar harga di beranda. 2) pages/cara-pesan.html, .pd-ledger__value
      dan langkah ke-4 di .pd-steps__item: placeholder [[ISI: jam buka]], [[ISI: nomor WhatsApp]], dan
      [[ISI: cara pembayaran]] tampil sebagai teks biasa, padahal di beranda dan halaman produk tampil
      sebagai lencana mono pd-label. Bungkus semuanya dengan span.pd-label agar ketiga halaman konsisten
      dan pemilik mudah melihat bagian yang masih harus diisi. Catatan: cara pembayaran tidak ada di daftar
      placeholder, jadi perlu dikonfirmasi ke klien. 3) pages/produk.html dan pages/cara-pesan.html, section
      utama: berikan panel tint berujung membulat yang sama seperti seksi featured di beranda, atau beri
      pembuka kecil "Kirim ke seluruh Karesidenan Kediri" di atas judul seperti di hero, supaya ciri hangat
      kunyit tidak hanya muncul di beranda.'
    evidence:
