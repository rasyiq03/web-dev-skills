  - role: penguji
    text: 'Setiap tombol harus jelas walau dibaca sendiri, misalnya ''Pesan Keripik Tempe lewat WhatsApp''
      (bukan ''Klik di sini'' atau ''Pesan''), tidak ditulis huruf kapital semua, dan boleh turun ke baris
      berikutnya di HP. Harga, nomor WhatsApp, tautan marketplace, dan jam buka tetap berupa placeholder
      [[ISI: ...]] sampai klien mengisinya; jangan mengarang angka, rating, atau jumlah pembeli, dan bila
