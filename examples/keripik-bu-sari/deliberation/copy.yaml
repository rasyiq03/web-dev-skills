      Catatan bawah diganti jadi tautan berlabel ''Belanja di marketplace'' dengan href [[ISI: tautan
      marketplace]]. How-to-order: langkah 1 jadi ''Chat Bu Sari di WhatsApp'' dengan nomor sebagai tautan
      tel/wa.me di dalam teks, langkah memakai <ol> biasa, dan subjudul ''Belanja di marketplace'' memakai
      tautan berlabel yang sama seperti di catalog.'
    target_role: penulis
    objection: 'Di draf, placeholder tautan marketplace dipakai sebagai teks tautan, misalnya ''pesan
      lewat [[ISI: tautan marketplace]]''. Kalau nanti diisi URL mentah, tautan itu tidak jelas bagi pembaca
      layar dan bisa memanjang keluar layar HP. Label tautan sebaiknya tetap berupa kata-kata, dan URL
      hanya masuk ke href. Ini soal struktur, bukan selera, tapi tidak memblokir karena mudah diperbaiki.'
