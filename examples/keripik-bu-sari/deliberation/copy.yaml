    text: 'Usulan perubahan untuk draf Penulis, per seksi. Hero: judul dipendekkan jadi ''Keripik pedas
      buatan rumah dari Kediri'' (nama usaha sudah ada di header), dan tautan WhatsApp ditulis https://wa.me/[[ISI:
      nomor WhatsApp]]?text=Halo%20Bu%20Sari%2C%20saya%20mau%20pesan%20keripik. Nomornya ditulis dengan
      format 62..., tanpa + dan tanpa 0 di depan. Featured: tiga produk dan deskripsinya ditulis sekali
      saja di content/id.yaml, lalu dipakai juga di catalog sebagai HTML statis. Dengan begitu teksnya
      tidak bisa berbeda, dan halaman tetap terbaca walau JavaScript mati. Catalog: tombol per produk
