- round: 2
  kind: critique
  entries:
  - role: perancang
    text: 'Perbaikan untuk draf Penulis, per seksi. (1) hero: judul dipendekkan jadi ''Keripik pedas buatan
      rumah dari Kediri'' (6 kata) supaya pas sebagai pernyataan besar DM Serif Display. ''Keripik Bu
      Sari'' pindah ke label kecil di atas judul. Isi tetap satu kalimat. Hanya ada satu tombol ''Pesan
      lewat WhatsApp''. ''Lihat semua produk'' menjadi tautan teks biasa di bawahnya, bukan tombol kedua.
      (2) featured: judul ''Tiga camilan andalan Bu Sari'' dipertahankan. Tiap produk ditulis dalam satu
      baris: nama di kiri, [[ISI: harga produk]] sejajar di kanan, lalu satu kalimat deskripsi pendek
      di bawahnya. Tombol bawah diganti dari ''Lihat daftar harga lengkap'' menjadi ''Lihat semua produk''
      supaya labelnya sama dengan tautan di hero. (3) catalog: susunan nama, harga, dan tombol per produk
      dipertahankan. Kalimat ''Harga bisa kamu tanyakan juga di chat'' dihapus karena daftar harga di
      halaman ini seharusnya sudah menjawab soal harga. (4) how-to-order: jam buka dimasukkan ke langkah
      1, jadi ''Chat Bu Sari di WhatsApp [[ISI: nomor WhatsApp]], jam [[ISI: jam buka]].'' Subjudul ''Jam
      buka'' dihapus. Area kirim tetap di langkah 3, dan semua langkah tetap satu kalimat dengan sapaan
      ''kamu''.'
    target_role: penulis
    objection: Hero di draf punya dua tombol dan judul 9 kata. Itu melemahkan hero berupa pernyataan teks
      dan membuat ajakan pesan lewat WhatsApp bersaing dengan tombol lain. Ini bukan soal selera, tapi
      saya tidak memblokir karena perbaikannya kecil.
