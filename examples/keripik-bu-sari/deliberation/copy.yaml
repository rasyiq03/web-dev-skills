    text: 'Perbaikan untuk draf Penulis, per seksi. hero: pesan awal WhatsApp diganti jadi ''Halo Bu Sari,
      saya mau pesan camilan.'', karena makaroni bukan keripik; judul ini jadi satu-satunya h1 di index.
      featured: judul seksi jadi h2, dan tiap nama produk jadi h3 supaya urutan judul rapi. catalog: judul
