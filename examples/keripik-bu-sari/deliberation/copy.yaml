      (misalnya ''Pesan keripik tempe lewat WhatsApp''), boleh turun baris di HP, supaya pembaca layar
      tahu tombol ini membuka aplikasi lain. Catatan bawah ditulis ''Lebih suka belanja di marketplace?
      Buka toko kami di [[ISI: nama marketplace]]'', dengan [[ISI: tautan marketplace]] hanya dipakai
      sebagai alamat tautan, jangan sebagai teks yang tampil. Kalimat ''Harga bisa kamu tanyakan juga
      di chat'' dihapus. how-to-order: ''Cara pesan'' jadi h1, sedangkan ''Jam buka'' dan ''Belanja di
      marketplace'' jadi h2. Langkah 1 ditulis ''Chat Bu Sari di WhatsApp'', dan nomornya jadi tautan
      wa.me yang teksnya nomor itu sendiri. Langkah 3 dipecah supaya area kirim ''Kami kirim ke seluruh
