  - role: perancang
    text: Hero cukup satu judul pendek (maksimal 6–8 kata) yang menyebut keripik pedas buatan rumah dari
      Kediri, satu kalimat pendukung, dan satu tombol "Pesan lewat WhatsApp", tanpa foto karena hero berupa
      pernyataan teks. Judul seksi lain juga harus pendek dan memakai sapaan "kamu" yang sama. Di seksi
      produk dan katalog, nama produk jadi baris utama dan harga sejajar di kanan seperti daftar harga
      warung. Langkah cara pesan cukup 3–4 langkah bernomor, masing-masing satu kalimat, dan nomor WhatsApp,
      area kirim, serta jam buka diletakkan di langkahnya masing-masing.
