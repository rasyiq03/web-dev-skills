  - role: arsitek
    text: 'Tiga produk dari brief (keripik singkong balado, keripik tempe, makaroni pedas) ditulis langsung
      di HTML sebagai konten tetap, bukan lewat data mock, dan harganya tetap [[ISI: harga produk]]. Dengan
      begitu daftar harga tetap terbaca walau JavaScript mati, dan tidak perlu pemanggilan API tambahan.
      Setiap produk di featured dan catalog punya tautan WhatsApp sendiri dengan pesan awal berisi nama
      produk, misalnya ''Pesan keripik tempe lewat WhatsApp'', dari satu nomor [[ISI: nomor WhatsApp]].
      Label tombol paling banyak sekitar 24 karakter supaya muat satu baris di layar 360 px, judul seksi
      pendek, dan cara-pesan berupa daftar bernomor <ol> biasa tanpa animasi.'
