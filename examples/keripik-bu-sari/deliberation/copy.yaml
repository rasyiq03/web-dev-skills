  - role: penulis
    text: 'Perbaikan untuk Penguji: contoh tombol ''Pesan Keripik Tempe lewat WhatsApp'' saya ubah jadi
      ''Pesan keripik tempe''. Nama produk ditulis huruf kecil seperti kalimat biasa, dan labelnya tetap
      jelas walau dibaca sendiri karena menyebut tindakan dan produknya. Kata ''lewat WhatsApp'' cukup
      ada di judul seksi dan di tombol utama, jadi tombol tidak terlalu panjang dan tidak bertabrakan
      dengan batas sekitar 24 karakter dari Arsitek. Judul seksi juga sebaiknya lebih jelas dari sekadar
      ''Produk'', misalnya ''Daftar produk dan harga''. Penyesuaian drafku: (1) untuk Perancang, judul
      hero jadi ''Camilan pedas buatan rumah dari Kediri'' (6 kata), nama Keripik Bu Sari pindah ke baris
      kecil di atas judul. Hero hanya punya satu tombol, ''Pesan lewat WhatsApp'', dan ''Lihat semua produk''
      jadi tautan teks biasa. Cara pesan dibuat 4 langkah, masing-masing satu kalimat: 1. Chat Bu Sari
      di WhatsApp [[ISI: nomor WhatsApp]] pada jam buka [[ISI: jam buka]]. 2. Tulis produk dan jumlahnya.
      3. Kirim alamat lengkapmu, kami kirim ke seluruh Karesidenan Kediri. 4. Bayar pesananmu: [[ISI:
      cara pembayaran]]. Subjudul ''Jam buka'' yang terpisah saya hapus. (2) Untuk Arsitek dan Wakil klien,
      tiga produk ditulis tetap di HTML, dan setiap produk punya tombol WhatsApp dengan pesan awal berisi
      nama produknya. (3) Untuk Wakil klien, kata ''renyah'' dan ''nendang'' saya coret supaya tidak terbaca
      sebagai klaim rasa. Judul featured jadi ''Tiga camilan buatan Bu Sari'' (bukan ''andalan'', supaya
      tidak terkesan terlaris). Kalimat ''Harga bisa kamu tanyakan juga di chat'' saya hapus. Cara bayar
      tetap placeholder, tanpa QRIS, transfer, atau COD. (4) Untuk Penguji, harga ditulis ''Rp15.000''
      dan jam ditulis ''08.00–17.00 WIB'' setelah klien mengisinya, tidak ada huruf kapital semua, dan
      tidak ada klise.'
    target_role: penguji
    objection: Batas 24 karakter dari Arsitek cocok untuk tombol hero dan cara-pesan, tetapi jangan dipakai
      untuk tombol per produk. 'Pesan keripik singkong balado' panjangnya 29 karakter, dan nama produk
      tidak boleh disingkat menjadi nama yang tidak ada di brief. Tombol itu dibiarkan turun ke baris
      berikutnya di HP, sesuai usul Penguji.
