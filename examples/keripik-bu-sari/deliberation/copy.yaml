  entries:
  - role: penulis
    text: "# Halaman index\n\n## hero\nJudul: Keripik Bu Sari, camilan pedas buatan rumah dari Kediri\n\
      Isi: Ada keripik singkong balado, keripik tempe, dan makaroni pedas. Pesan lewat WhatsApp, kami\
      \ kirim ke seluruh Karesidenan Kediri.\nTombol utama: Pesan lewat WhatsApp  (tautan: https://wa.me/[[ISI:\
      \ nomor WhatsApp]], pesan awal: \"Halo Bu Sari, saya mau pesan keripik.\")\nTombol kedua: Lihat\
      \ semua produk\n\n## featured\nJudul: Tiga camilan andalan Bu Sari\nIsi: Semua dibuat sendiri di\
      \ dapur rumah Bu Sari di Kediri.\nProduk:\n- Keripik singkong balado. [[ISI: harga produk]]\n  Keripik\
      \ singkong renyah dengan bumbu balado, buat teman ngemil kapan saja.\n- Keripik tempe. [[ISI: harga\
      \ produk]]\n  Keripik tempe buatan rumah, cocok buat camilan atau lauk di meja makan.\n- Makaroni\
      \ pedas. [[ISI: harga produk]]\n  Makaroni goreng berbumbu pedas buat kamu yang suka camilan nendang.\n\
      Tombol: Lihat daftar harga lengkap\n\n# Halaman produk\n\n## catalog\nJudul: Daftar produk dan harga\n\
      Isi: Pilih camilan yang kamu mau, lalu pesan langsung lewat WhatsApp. Harga bisa kamu tanyakan juga\
      \ di chat.\nProduk:\n- Keripik singkong balado. [[ISI: harga produk]]\n  Keripik singkong renyah\
      \ dengan bumbu balado, buat teman ngemil kapan saja.\n  Tombol: Pesan keripik singkong balado\n\
      - Keripik tempe. [[ISI: harga produk]]\n  Keripik tempe buatan rumah, cocok buat camilan atau lauk\
      \ di meja makan.\n  Tombol: Pesan keripik tempe\n- Makaroni pedas. [[ISI: harga produk]]\n  Makaroni\
      \ goreng berbumbu pedas buat kamu yang suka camilan nendang.\n  Tombol: Pesan makaroni pedas\n(Setiap\
      \ tombol membuka https://wa.me/[[ISI: nomor WhatsApp]] dengan pesan awal \"Halo Bu Sari, saya mau\
      \ pesan <nama produk>.\")\nCatatan bawah: Lebih suka belanja di marketplace? [[ISI: tautan marketplace]]\n\
      \n# Halaman cara-pesan\n\n## how-to-order\nJudul: Cara pesan\nIsi: Pesan cukup lewat chat, kami\
      \ bantu sampai paketnya sampai.\nLangkah:\n1. Chat Bu Sari di WhatsApp [[ISI: nomor WhatsApp]].\n\
      2. Tulis produk yang kamu mau dan jumlahnya.\n3. Kirim alamat lengkapmu. Kami kirim ke seluruh Karesidenan\
      \ Kediri.\n4. Bayar pesananmu: [[ISI: cara pembayaran]]\nSubjudul: Jam buka\nIsi: [[ISI: jam buka]]\n\
      Subjudul: Belanja di marketplace\nIsi: Kamu juga bisa pesan lewat [[ISI: tautan marketplace]]\n\
      Tombol: Pesan lewat WhatsApp\n\n# Catatan untuk dewan\n- Cara bayar tidak ada di brief, jadi saya\
      \ beri placeholder baru [[ISI: cara pembayaran]] (aturan sidang 6); tidak ada klaim QRIS, transfer,\
      \ atau COD.\n- Deskripsi produk sengaja hanya memakai nama produk, \"buatan rumah\", dan Kediri.\
      \ Keripik tempe tidak saya sebut pedas karena brief tidak menyatakannya. Kata \"renyah\", \"teman\
      \ ngemil\", dan \"nendang\" adalah gaya bahasa, bukan fakta baru; Wakil klien boleh mencoretnya\
      \ bila dianggap klaim.\n- Sapaan \"kamu\" dipakai di seluruh halaman sesuai d-tone-1; tidak ada\
      \ frasa dari daftar klise.\n"
