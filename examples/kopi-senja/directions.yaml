  style: editorial
  palette: ink-on-cream
  type_pairing: fraunces-plex
  layout:
    hero: stacked-statement
    services: feature-rows
    proof: facts-ledger
    story: two-column-narrative
    contact: map-band
  motion: low
  tone: tenang-akrab
  register:
    id: kamu
  summary: Cafe as a reading room; serif headings and cream paper.
  rationale:
    style: A quiet reading-room look suits students who stay for hours.
    color: Cream and brick feel warm without the dark-brown look of chain coffee shops.
    typography: A serif display suits students who come to read and work for hours.
    layout: A stacked statement keeps the hero readable before photos exist.
    motion: Little motion keeps attention on reading and the menu.
    tone: A calm, friendly register with "kamu" fits students without sounding loud.
