    layout: { shell: topbar-tabs, filters: filter-drawer, kpis: kpi-lead, charts: chart-lead-side, records: table-plain }
    motion: low
    tone: hangat-ringkas
    register: { id: Anda }
    summary: Satu angka utama besar (omzet hari ini), sisanya pendukung.
    rationale:
      style: Grid tenang menonjolkan satu angka yang paling sering dicek pemilik.
      color: Amber hangat seperti warna kue panggang, dipakai hemat.
