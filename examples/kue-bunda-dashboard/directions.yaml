    tone: ramah
    register: { id: Anda }
    summary: Dashboard yang terasa seperti toko kue sendiri, hangat dan ramah.
    rationale:
      style: Usaha keluarga lebih nyaman dengan tampilan hangat daripada aplikasi kantor.
      color: Kuning kunyit hangat seperti kue yang baru dipanggang.
      typography: Nunito yang bulat ramah.
      layout: Omzet besar di atas lalu grafik bertumpuk untuk HP.
      motion: Gerak rendah pada tab saja, supaya angka penjualan tetap tenang.
