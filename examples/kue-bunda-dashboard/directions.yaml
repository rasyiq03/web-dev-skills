    style: data-utility
    palette: night-desk
    type_pairing: atkinson
    layout: { shell: icon-rail, filters: filter-bar, kpis: kpi-row, charts: chart-grid-2, records: table-dense }
    motion: none
    tone: jelas-ringkas
    register: { id: Anda }
    summary: Mode gelap dengan huruf Atkinson yang sangat terbaca, untuk cek malam hari.
    rationale:
      style: Pemilik toko sering mengecek penjualan setelah toko tutup.
      color: Latar gelap nyaman dibaca malam hari.
      typography: Atkinson Hyperlegible dirancang untuk keterbacaan tinggi.
