# Anchors: who = pemilik toko (cek angka cepat, sering di HP); where = Medan;
# what = omzet harian, jumlah pesanan, produk terlaris; data belum ada (mock).
directions:
  - id: dir-1
    probability: 0.36
    style: data-utility
    palette: slate-light
    type_pairing: public-sans
    layout: { shell: topbar-tabs, filters: filter-bar, kpis: kpi-row, charts: chart-stack, records: table-plain }
    motion: none
    tone: jelas-ringkas
    register: { id: Anda }
    summary: Layar data yang tenang; warna hanya untuk arti, angka paling menonjol.
    rationale:
      style: Pemilik toko kue perlu membaca omzet dan pesanan sekilas, jadi tampilan padat dan netral paling tepat.
      color: Abu terang dan warna hanya untuk naik-turun omzet, supaya tidak ada yang mengalihkan dari angka.
      typography: Public Sans jelas untuk angka di HP pemilik.
      layout: Tab di atas lebih mudah dipakai di HP daripada menu samping, lalu tiga angka utama dan grafik bertumpuk.
      motion: Tanpa animasi supaya angka langsung tampil.
      tone: Pemilik hanya butuh label singkat yang jelas.
    based_on: [req-audience, req-facts.metrics, req-goal]
  - id: dir-2
    probability: 0.22
    style: data-utility
    palette: teal-ledger
    type_pairing: plex-data
    layout: { shell: sidebar-left, filters: filter-bar, kpis: kpi-ledger, charts: chart-grid-2, records: table-dense }
    motion: none
    tone: jelas-ringkas
    register: { id: Anda }
    summary: Seperti buku kas digital, rapi untuk pemilik yang terbiasa mencatat.
    rationale:
      style: Buku kas adalah alat yang sudah dikenal pemilik toko kue.
      color: Hijau toska untuk angka positif terasa seperti buku besar.
      typography: IBM Plex dengan angka tabular memudahkan membandingkan omzet.
      layout: Menu samping dan dua grafik berdampingan di layar laptop toko.
      motion: Tanpa animasi supaya angka omzet langsung tampil di HP pemilik.
      tone: Label singkat seperti kolom buku kas yang sudah dikenal pemilik.
    based_on: [req-audience, req-facts.metrics]
