id: data-utility
name: Data Utility
summary: Dense, neutral interface for numbers and tables; clarity first, color only for meaning.
suits: Dashboards, admin panels, internal tools, reporting pages, and inventory or order tracking for small businesses.
formality: neutral
avoid: Marketing sites, portfolios, and anything whose main job is to persuade or charm.

base:
  type_scale: { base: 0.9375rem, ratio: 1.2 }
  space: { xs: 0.25rem, sm: 0.5rem, md: 0.75rem, lg: 1.5rem, xl: 2.5rem, section: 3rem }
  radius: { none: 0, sm: 0.375rem }
  border: { width: 1px, strong: "1px solid var(--pd-color-muted)" }
  shadow: { hard: "none", hard-sm: "none" }
  motion: { fast: 100ms, base: 150ms, easing: "ease-out" }

palettes:
  - id: slate-light
    mood: Cool light grey with a clear blue; neutral and readable all day.
    colors: { ink: "#0F172A", paper: "#F8FAFC", accent: "#1D4ED8", muted: "#475569", accent-ink: "#FFFFFF" }
  - id: night-desk
    mood: Dark slate with soft blue; for long sessions and control rooms.
    colors: { ink: "#E5E7EB", paper: "#111827", accent: "#7DB3F5", muted: "#A3ABB8", accent-ink: "#0B1220" }
  - id: teal-ledger
    mood: Warm paper white and bookkeeping teal; calm, financial, trustworthy.
    colors: { ink: "#1F1A14", paper: "#FBFAF7", accent: "#0F6E66", muted: "#57534E", accent-ink: "#FFFFFF" }

pairings:
  - id: plex-data
    display: IBM Plex Sans
    body: IBM Plex Sans
    mono: IBM Plex Mono
  - id: public-sans
    display: Public Sans
    body: Public Sans
    mono: Space Mono
  - id: atkinson
    display: Atkinson Hyperlegible
    body: Atkinson Hyperlegible
    mono: JetBrains Mono

components:
  button: Compact, small radius, accent fill for the one primary action per view; secondary actions
    are text buttons; focus ring always visible.
  card: Panel with a 1px muted border, title row with unit and period, no shadow, tight padding.
  section: Panels on a plain background separated by a consistent gap; no color blocks.
  label: Mono font for figures with tabular numerals; muted color for units and periods.
  image: Rarely used; icons only with a text label beside them.

signature_moves:
  - Every number shows its unit and period next to it, in muted text.
  - Positive and negative changes use the status tokens plus an arrow, never color alone.
  - Tables right-align numbers and keep the header visible while scrolling.
